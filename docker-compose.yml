services:
  db:
    image: postgis/postgis:16-3.4
    container_name: medgraph_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: medgraph_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # interface web do Neo4j Browser
      - "7687:7687"   # protocolo Bolt (usado pela API)
    volumes:
      - neo4jdata:/data

  api:
    build:
      context: .
      args:
        INSTALAR_WHISPER: ${INSTALAR_WHISPER:-1}
    container_name: medgraph_api
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./app:/code/app   # recarrega a API ao salvar o código
      - ./tests:/code/tests
      - uploads:/code/uploads   # áudios e fotos dos atendimentos (dados de saúde)
      - whisper_cache:/root/.cache/huggingface   # modelo do Whisper (baixa uma vez)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  neo4jdata:
  uploads:
  whisper_cache:
